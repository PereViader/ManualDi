name: Publish Nuget Package

on:
  workflow_call:

jobs:
  PublishNugetPackage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - id: get-version
        run: |
          source .env.shared
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Pack Sync NuGet
        run: |
          dotnet build ManualDi.Sync --configuration Release
          dotnet pack ManualDi.Sync --configuration Release --output ManualDi.Sync.Nuget -p:PackageVersion=${{ steps.get-version.outputs.version }}

      - name: Build and Pack Async NuGet
        run: |
          dotnet build ManualDi.Async --configuration Release
          dotnet pack ManualDi.Async --configuration Release --output ManualDi.Async.Nuget -p:PackageVersion=${{ steps.get-version.outputs.version }}

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: pere.viader

      - name: Publish Sync NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "ManualDi.Sync.Nuget/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: Publish Async NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "ManualDi.Async.Nuget/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_API_KEY" --skip-duplicate
