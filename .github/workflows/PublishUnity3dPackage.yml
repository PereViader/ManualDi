name: Publish Unity3d Packages
on: 
  workflow_call:

jobs:
  PublishUnity3dPackage:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      DIST_DIR: /tmp/signed-upm-dist
      UPM_CLI_VERSION: v10.0.0
      UPM_CLI_SHA256: 85852820608b9bb81bf112f8a9f242e06bbed0fceabb0eab24e4cabbdbec08a2
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: get-version
        run: |
          source .env.shared
          if [ -z "${VERSION:-}" ]; then
            echo "Error: VERSION is empty in .env.shared" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION,,}" =~ -(preview|alpha|beta|rc) ]]; then
            echo "isPrerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "isPrerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release exists
        id: release-exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set +e
          output=$(gh release view "v${VERSION}" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            release_exists="true"
          elif echo "$output" | grep -qi "release not found"; then
            release_exists="false"
          else
            echo "Error checking release v${VERSION} (exit $status): $output" >&2
            exit "$status"
          fi
          echo "Release exists: $release_exists"
          echo "exists=$release_exists" >> "$GITHUB_OUTPUT"

      - name: Get changelog
        id: get-changelog
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "changelog<<$delimiter"
            git log "$(git describe --tags --abbrev=0 HEAD)..HEAD" --pretty=format:"%s%n%b"
            echo ""
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.release-exists.outputs.exists == 'false' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Create Sync Package
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          bash ./ManualDi.Sync.Unity3d/GenerateUnityPackage/GeneratePackage.sh

      - name: Create Async Package
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          bash ./ManualDi.Async.Unity3d/GenerateUnityPackage/GeneratePackage.sh

      - name: Install Unity UPM CLI
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          zip_path="$tmp_dir/upm-linux-x64.zip"
          curl -fsSL "https://cdn.packages.unity.com/upm-cli/releases/${UPM_CLI_VERSION}/upm-linux-x64.zip" -o "$zip_path"
          echo "${UPM_CLI_SHA256}  ${zip_path}" | sha256sum -c -
          install_dir="$HOME/.upm/bin"
          mkdir -p "$install_dir"
          unzip -q "$zip_path" -d "$install_dir"
          chmod +x "$install_dir/UnityPackageManager"
          cat > "$install_dir/upm" << 'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/UnityPackageManager" "$@"
          EOF
          chmod +x "$install_dir/upm"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: upm --help

      - name: Sign and Pack Packages
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          mkdir -p "$DIST_DIR"
          upm pack ./ManualDi.Sync.Unity3d.Package --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"
          upm pack ./ManualDi.Async.Unity3d.Package --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Print signed package info
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 2 ]; then
            printf 'Expected exactly two signed package archives, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            printf 'Checking Archive: %s\n' "$(basename "$archive")"
            tar -tzf "$archive" | grep -qx 'package/package.json'
            tar -tzf "$archive" | grep -qx 'package/.attestation.p7m'
            tar -xOzf "$archive" package/package.json | jq '{name, version}'
          done

      - name: Create github release
        if: ${{ steps.release-exists.outputs.exists == 'false' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: ManualDi Unity3d v${{ steps.get-version.outputs.version }}
          body: ${{ steps.get-changelog.outputs.changelog }}
          prerelease: ${{ steps.get-version.outputs.isPrerelease }}
          files: |
            /tmp/signed-upm-dist/*.tgz
            /tmp/signed-upm-dist/*.tar.gz