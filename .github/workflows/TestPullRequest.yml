name: Test Pull Request
on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  TestCommon:
    uses: ./.github/workflows/TestCommon.yml

  TestUnity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/TestUnity.yml
    secrets: inherit
