name: Test Unity

on: 
  workflow_call:

jobs:
  testAllModes:
    name: Test all modes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        projectPath:
          - ManualDi.Sync.Unity3d
          - ManualDi.Async.Unity3d

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'
      - name: Setup common packages
        run: |
          bash setup.sh
      - uses: actions/cache@v5
        with:
          path: ${{ matrix.projectPath }}/Library
          key: Library-${{ matrix.projectPath }}-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', matrix.projectPath)) }}-${{ hashFiles(format('{0}/Packages/packages-lock.json', matrix.projectPath)) }}
          restore-keys: |
            Library-${{ matrix.projectPath }}-${{ hashFiles(format('{0}/ProjectSettings/ProjectVersion.txt', matrix.projectPath)) }}-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ matrix.projectPath }}
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+ManualDi*'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test results ${{ matrix.projectPath }}
          path: artifacts
      - uses: actions/upload-artifact@v7
        if: always() && steps.tests.outputs.coveragePath != ''
        with:
          name: Coverage results ${{ matrix.projectPath }}
          path: ${{ steps.tests.outputs.coveragePath }}
